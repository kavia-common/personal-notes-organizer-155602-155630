<div class="nav-inner">
  <div class="brand">
    <span class="dot"></span>
    <strong>Notes</strong>
  </div>

  <div class="grow"></div>

  <div class="search">
    <input class="input" type="search" placeholder="Search notes..." [(ngModel)]="search" (ngModelChange)="onSearchChange()" />
  </div>

  <div class="actions">

      🌓
    </button>

      Logout
    </button>
  </div>
</div>
